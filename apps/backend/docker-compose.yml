version: '3.7'
services :
  backend_template_db:
    container_name: news_backend_db
    image: postgres:15.4
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: ${TYPEORM_USERNAME}
      POSTGRES_PASSWORD: ${TYPEORM_PASSWORD}
      POSTGRES_DB: ${TYPEORM_DATABASE}
    networks:
      - news_backend_network

networks:
  news_backend_network:
    name: news_backend_network
    driver: bridge
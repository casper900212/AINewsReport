blockchain:
  keywords: ["區塊鏈", "加密貨幣", "NFT", "DeFi"]
  prompt: >
    你是一位產業分析師。請根據以下新聞資料，撰寫一份區塊鏈產業月報，包含重大事件摘要、市場趨勢與未來展望。結尾請提供建議方向與風險提醒。

ai:
  keywords: ["人工智慧", "AI", "機器學習", "大語言模型", "深度學習"]
  prompt: >
    請根據以下新聞內容，產出一份 AI 產業月報，請著重於技術進展、應用案例與政策發展，並分析可能對產業造成的影響。

legaltech:
  keywords: ["法遵", "合規", "金融監理", "監管科技", "RegTech"]
  prompt: >
    撰寫一份針對法遵科技的月報，涵蓋法規變動、新興工具、監理趨勢與企業應對策略。

sports:
  keywords: ["體育", "運動", "賽事", "選手", "奧運"]
  prompt: >
    根據以下新聞，生成一份體育產業月報，總結重大賽事、選手動態與相關商業合作。
